[faq]
faq = "अक्सर पूछे जाने वाले प्रश्न"
faq_title = "डीटीआर अक्सर पूछे जाने वाले प्रश्न"
faq_subtitle = "कस्टम दैनिक समय रिकॉर्ड ट्रैकर का उपयोग करने के बारे में सामान्य प्रश्न।"
faq_back_to_dtr = "डीटीआर को लौटें"
faq_q_what_is_dtr_for = "यह डीटीआर किस लिए है?"
faq_a_what_is_dtr_for = "इस डीटीआर का उपयोग आपके दैनिक ओजेटी घंटे, प्रतिबिंब, उपलब्धियों और टेलीमेट्री को लॉग करने के लिए किया जाता है ताकि आप समय के साथ प्रगति और प्रदर्शन के रुझान को ट्रैक कर सकें।"
faq_q_add_daily_entry = "मैं दैनिक प्रविष्टि कैसे जोड़ूँ?"
faq_a_add_daily_entry_prefix = "मुख्य पृष्ठ पर जाएँ, काम करने की तिथि और घंटे निर्धारित करें, अपने नोट्स पूरे करें, फिर क्लिक करें"
faq_a_add_daily_entry_suffix = ". आपका रिकॉर्ड आपके ब्राउज़र में स्थानीय रूप से सहेजा गया है।"
faq_q_edit_or_delete = "क्या मैं प्रविष्टियाँ संपादित या हटा सकता हूँ?"
faq_a_edit_or_delete = "हाँ। आप किसी विशिष्ट रिकॉर्ड को अद्यतन करने, अंतिम प्रविष्टि को हटाने, या स्थानीय संग्रहण से सभी रिकॉर्ड साफ़ करने के लिए व्यूअर/संपादन टूल का उपयोग कर सकते हैं।"
faq_q_what_is_telemetry_view = "टेलीमेट्री व्यू क्या है?"
faq_a_what_is_telemetry_view = "टेलीमेट्री व्यू आपके डीटीआर लॉग के आधार पर गति, पूर्वानुमान पूर्णता, डेल्टा रुझान और कल्याण संकेतक जैसे दृश्य विश्लेषण प्रदान करता है।"
faq_q_where_is_data_stored = "मेरा डेटा कहाँ संग्रहीत है?"
faq_a_where_is_data_stored = "डेटा आपके ब्राउज़र में संग्रहीत है (छवियों के लिए लोकलस्टोरेज और इंडेक्सेडडीबी)। जब तक आप कोई सर्वर नहीं जोड़ते, यह स्वचालित रूप से सर्वर से समन्वयित नहीं होता है।"
faq_q_icons_not_updating = "कुछ चिह्न या शैली परिवर्तन तुरंत अपडेट क्यों नहीं हो रहे हैं?"
faq_a_icons_not_updating = "मोबाइल ब्राउज़र आक्रामक रूप से कैश करते हैं। पेज को रीफ्रेश करें, साइट डेटा/कैश साफ़ करें, या थीम/आइकन अपडेट के बाद टैब को फिर से खोलें।"

