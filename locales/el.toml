[faq]
faq = "FAQ"
faq_title = "Συχνές ερωτήσεις DTR"
faq_subtitle = "Συνήθεις ερωτήσεις σχετικά με τη χρήση της προσαρμοσμένης παρακολούθησης ημερήσιας εγγραφής χρόνου."
faq_back_to_dtr = "Επιστροφή στο DTR"
faq_q_what_is_dtr_for = "Σε τι χρησιμεύει αυτό το DTR;"
faq_a_what_is_dtr_for = "Αυτό το DTR χρησιμοποιείται για την καταγραφή των ημερήσιων ωρών OJT, του προβληματισμού, των επιτευγμάτων και της τηλεμετρίας, ώστε να μπορείτε να παρακολουθείτε την πρόοδο και τις τάσεις απόδοσης με την πάροδο του χρόνου."
faq_q_add_daily_entry = "Πώς μπορώ να προσθέσω μια ημερήσια καταχώριση;"
faq_a_add_daily_entry_prefix = "Μεταβείτε στην κύρια σελίδα, ορίστε την ημερομηνία και τις ώρες εργασίας, συμπληρώστε τις σημειώσεις σας και μετά κάντε κλικ"
faq_a_add_daily_entry_suffix = ". Η εγγραφή σας αποθηκεύεται τοπικά στο πρόγραμμα περιήγησής σας."
faq_q_edit_or_delete = "Μπορώ να επεξεργαστώ ή να διαγράψω καταχωρήσεις;"
faq_a_edit_or_delete = "Ναί. Μπορείτε να χρησιμοποιήσετε τα εργαλεία προβολής/επεξεργασίας για να ενημερώσετε μια συγκεκριμένη εγγραφή, να διαγράψετε την τελευταία καταχώρηση ή να διαγράψετε όλες τις εγγραφές από τον τοπικό χώρο αποθήκευσης."
faq_q_what_is_telemetry_view = "Τι είναι η τηλεμετρική προβολή;"
faq_a_what_is_telemetry_view = "Το Telemetry View παρέχει οπτικά αναλυτικά στοιχεία, όπως ρυθμό, ολοκλήρωση προβλέψεων, τάσεις δέλτα και δείκτες ευεξίας με βάση τα αρχεία καταγραφής DTR."
faq_q_where_is_data_stored = "Πού αποθηκεύονται τα δεδομένα μου;"
faq_a_where_is_data_stored = "Τα δεδομένα αποθηκεύονται στο πρόγραμμα περιήγησής σας (localStorage και IndexedDB για εικόνες). Δεν συγχρονίζεται αυτόματα σε διακομιστή, εκτός εάν προσθέσετε έναν."
faq_q_icons_not_updating = "Γιατί ορισμένα εικονίδια ή αλλαγές στυλ δεν ενημερώνονται αμέσως;"
faq_a_icons_not_updating = "Τα προγράμματα περιήγησης για κινητά αποθηκεύουν επιθετικά την προσωρινή μνήμη. Ανανεώστε τη σελίδα, διαγράψτε τα δεδομένα/την προσωρινή μνήμη του ιστότοπου ή ανοίξτε ξανά την καρτέλα μετά από ενημερώσεις θέματος/εικονιδίου."

