[faq]
faq = "FAQ"
faq_title = "DTR UKK"
faq_subtitle = "Yleisiä kysymyksiä mukautetun päivittäisen aikatallenteen käytöstä."
faq_back_to_dtr = "Takaisin DTR:ään"
faq_q_what_is_dtr_for = "Mihin tämä DTR on tarkoitettu?"
faq_a_what_is_dtr_for = "Tätä DTR:ää käytetään päivittäisten OJT-tuntien, pohdinnan, saavutusten ja telemetrian kirjaamiseen, jotta voit seurata edistymistä ja suorituskykytrendejä ajan mittaan."
faq_q_add_daily_entry = "Kuinka lisään päivittäisen merkinnän?"
faq_a_add_daily_entry_prefix = "Siirry pääsivulle, aseta päivämäärä ja työtunnit, täytä muistiinpanot ja napsauta sitten"
faq_a_add_daily_entry_suffix = ". Tietueesi tallennetaan paikallisesti selaimeesi."
faq_q_edit_or_delete = "Voinko muokata tai poistaa merkintöjä?"
faq_a_edit_or_delete = "Kyllä. Katselu-/muokkaustyökalujen avulla voit päivittää tietyn tietueen, poistaa viimeisen merkinnän tai tyhjentää kaikki tietueet paikallisesta tallennustilasta."
faq_q_what_is_telemetry_view = "Mikä on telemetrianäkymä?"
faq_a_what_is_telemetry_view = "Telemetrianäkymä tarjoaa visuaalista analytiikkaa, kuten vauhtia, ennusteen valmistumista, deltatrendejä ja hyvinvointiindikaattoreita, jotka perustuvat DTR-lokiisi."
faq_q_where_is_data_stored = "Mihin tietoni on tallennettu?"
faq_a_where_is_data_stored = "Tiedot tallennetaan selaimeesi (localStorage ja IndexedDB kuville). Sitä ei synkronoida automaattisesti palvelimeen, ellet lisää sitä."
faq_q_icons_not_updating = "Miksi jotkin kuvakkeet tai tyylimuutokset eivät päivity välittömästi?"
faq_a_icons_not_updating = "Mobiiliselaimet tallentavat välimuistiin aggressiivisesti. Päivitä sivu, tyhjennä sivuston tiedot/välimuisti tai avaa välilehti uudelleen teeman/kuvakkeen päivityksen jälkeen."

