[faq]
faq = "Domande Frequenti (FAQs)"
faq_title = "FAQ del DTR"
faq_subtitle = "Domande comuni sull'uso del tracker del Registro Orario Giornaliero."
faq_back_to_dtr = "Torna al DTR"
faq_q_what_is_dtr_for = "A cosa serve questo DTR?"
faq_a_what_is_dtr_for = "Questo DTR viene utilizzato per registrare le ore giornaliere di OJT, le riflessioni, i risultati e la telemetria in modo da poter monitorare i progressi e le tendenze delle prestazioni nel tempo."
faq_q_add_daily_entry = "Come aggiungo una voce giornaliera?"
faq_a_add_daily_entry_prefix = "Vai alla pagina principale, imposta la data e le ore lavorate, completa le tue note, quindi fai clic su"
faq_a_add_daily_entry_suffix = ". Il tuo record viene salvato localmente nel tuo browser."
faq_q_edit_or_delete = "Posso modificare o eliminare le voci?"
faq_a_edit_or_delete = "Sì. Puoi utilizzare gli strumenti di visualizzazione/modifica per aggiornare un record specifico, eliminare l'ultima voce o cancellare tutti i record dalla memoria locale."
faq_q_what_is_telemetry_view = "Cos'è la Vista Telemetria?"
faq_a_what_is_telemetry_view = "La Vista Telemetria fornisce analisi visive come il ritmo, la previsione di completamento, le tendenze delta e gli indicatori di benessere basati sui log del DTR."
faq_q_where_is_data_stored = "Dove vengono memorizzati i miei dati?"
faq_a_where_is_data_stored = "I dati sono memorizzati nel browser (localStorage e IndexedDB per le immagini). Non vengono sincronizzati automaticamente con un server a meno che non ne venga aggiunto uno."
faq_q_icons_not_updating = "Perché alcune icone o modifiche di stile non si aggiornano immediatamente?"
faq_a_icons_not_updating = "I browser mobili eseguono la cache in modo aggressivo. Aggiorna la pagina, cancella i dati/cache del sito o riapri la scheda dopo gli aggiornamenti del tema o delle icone."

