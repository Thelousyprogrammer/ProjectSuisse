faq_a_add_daily_entry_suffix = ". Uw gegevens worden lokaal in uw browser opgeslagen."
faq_q_edit_or_delete = "Kan ik vermeldingen bewerken of verwijderen?"
faq_a_edit_or_delete = "Ja. U kunt de tools voor bekijken/bewerken gebruiken om een \u200b\u200bspecifiek record bij te werken, het laatste item te verwijderen of alle records uit de lokale opslag te wissen."
faq_q_what_is_telemetry_view = "Wat is telemetrieweergave?"
faq_a_what_is_telemetry_view = "Telemetry View biedt visuele analyses zoals tempo, voltooiing van prognoses, deltatrends en welzijnsindicatoren op basis van uw DTR-logboeken."
faq_q_where_is_data_stored = "Waar worden mijn gegevens opgeslagen?"
faq_a_where_is_data_stored = "Gegevens worden opgeslagen in uw browser (localStorage en IndexedDB voor afbeeldingen). Het wordt niet automatisch gesynchroniseerd met een server, tenzij u er een toevoegt."
