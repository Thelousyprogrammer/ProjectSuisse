[faq]
faq = "Veelgestelde vragen"
faq_title = "Veelgestelde vragen over DTR"
faq_subtitle = "Veelgestelde vragen over het gebruik van de Custom Daily Time Record-tracker."
faq_back_to_dtr = "Terug naar DTR"
faq_q_what_is_dtr_for = "Waar is deze DTR voor?"
faq_a_what_is_dtr_for = "Deze DTR wordt gebruikt om uw dagelijkse OJT-uren, reflectie, prestaties en telemetrie vast te leggen, zodat u de voortgang en prestatietrends in de loop van de tijd kunt volgen."
faq_q_add_daily_entry = "Hoe voeg ik een daginvoer toe?"
