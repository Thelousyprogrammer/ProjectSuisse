[faq]
faq = "FAQ"
faq_title = "DTR FAQ"
faq_subtitle = "맞춤 일일 시간 기록 추적기 사용에 관한 일반적인 질문입니다."
faq_back_to_dtr = "DTR로 돌아가기"
faq_q_what_is_dtr_for = "이 DTR은 무엇을 위한 것입니까?"
faq_a_what_is_dtr_for = "이 DTR은 일일 OJT 시간, 반성, 성과 및 원격 측정을 기록하는 데 사용되므로 시간 경과에 따른 진행 상황과 성과 추세를 추적할 수 있습니다."
faq_q_add_daily_entry = "일일 항목을 어떻게 추가하나요?"
faq_a_add_daily_entry_prefix = "메인 페이지로 이동하여 근무 날짜와 시간을 설정하고 메모를 작성한 후 클릭하세요."
faq_a_add_daily_entry_suffix = ". 귀하의 기록은 귀하의 브라우저에 로컬로 저장됩니다."
faq_q_edit_or_delete = "항목을 편집하거나 삭제할 수 있나요?"
faq_a_edit_or_delete = "예. 뷰어/편집 도구를 사용하여 특정 기록을 업데이트하거나, 마지막 항목을 삭제하거나, 로컬 저장소에서 모든 기록을 지울 수 있습니다."
faq_q_what_is_telemetry_view = "원격 측정 보기란 무엇입니까?"
faq_a_what_is_telemetry_view = "Telemetry View는 DTR 로그를 기반으로 속도, 예측 완료, 델타 추세 및 건강 지표와 같은 시각적 분석을 제공합니다."
faq_q_where_is_data_stored = "내 데이터는 어디에 저장되나요?"
faq_a_where_is_data_stored = "데이터는 브라우저(이미지의 경우 localStorage 및 IndexedDB)에 저장됩니다. 서버를 추가하지 않으면 서버에 자동으로 동기화되지 않습니다."
faq_q_icons_not_updating = "일부 아이콘이나 스타일 변경 사항이 즉시 업데이트되지 않는 이유는 무엇입니까?"
faq_a_icons_not_updating = "모바일 브라우저는 적극적으로 캐시합니다. 페이지를 새로 고치거나, 사이트 데이터/캐시를 지우거나, 테마/아이콘 업데이트 후 탭을 다시 엽니다."

