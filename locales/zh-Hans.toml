[faq]
faq = "常见问题解答 (FAQs)"
faq_title = "DTR 常见问题"
faq_subtitle = "关于使用自定义每日工时记录追踪器的常见问题。"
faq_back_to_dtr = "返回 DTR"
faq_q_what_is_dtr_for = "这个 DTR 的用途是什么？"
faq_a_what_is_dtr_for = "此 DTR 用于记录您的每日实习 (OJT) 时数、心得、成就及数据分析，以便您追踪长期进度与表现趋势。"
faq_q_add_daily_entry = "如何添加每日记录？"
faq_a_add_daily_entry_prefix = "前往主页面，设置日期与工作时数，完成笔记后点击"
faq_a_add_daily_entry_suffix = "。您的记录将保存在浏览器的本地存储中。"
faq_q_edit_or_delete = "我可以编辑或删除记录吗？"
faq_a_edit_or_delete = "是的。您可以使用查看/编辑工具来更新特定记录、删除最后一笔记录，或清除本地存储中的所有记录。"
faq_q_what_is_telemetry_view = "什么是数据分析视图？"
faq_a_what_is_telemetry_view = "数据分析视图根据您的 DTR 日志提供可视化分析，例如进度节奏、完成预测、差异 (Delta) 趋势及身心状态指标。"
faq_q_where_is_data_stored = "我的数据存储在哪里？"
faq_a_where_is_data_stored = "数据存储在您的浏览器中（localStorage 以及用于图片的 IndexedDB）。除非您手动连接服务器，否则不会自动同步。"
faq_q_icons_not_updating = "为什么有些图标或样式更改没有立即更新？"
faq_a_icons_not_updating = "移动端浏览器缓存较强。请尝试刷新页面、清除网站数据/缓存，或在更新主题/图标后重新打开标签页。"

